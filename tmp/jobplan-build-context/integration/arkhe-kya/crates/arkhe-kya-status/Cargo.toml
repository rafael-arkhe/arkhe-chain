[package]
name = "arkhe-kya-status"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "Bounded signed local status snapshots using the BSL v1.0 bit encoding; not a W3C VC implementation"

[dependencies]
arkhe-kya-primitives = { path = "../arkhe-kya-primitives" }
serde = { version = "1", features = ["derive"] }
base64 = "=0.22.1"
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }

[dev-dependencies]
ed25519-dalek = "=2.2.0"
hex = "0.4"
