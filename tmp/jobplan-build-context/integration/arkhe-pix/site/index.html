<!doctype html>
<html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arkhe Pix · recibo sintético</title><link rel="stylesheet" href="styles.css">
<main><h1>Recibo Pix · PoC sintético</h1>
<p>Verifica a assinatura do recibo contra uma chave informada por você. Não confirma liquidação, identidade das partes ou autorização KYA.</p>
<p>A chave de teste é pública e permite que qualquer pessoa emita fixtures.</p>
<label for="receipt">Recibo JSON (máximo 32 KiB)</label><textarea id="receipt" rows="14" spellcheck="false"></textarea>
<label for="key">Chave Ed25519 pública confiável (hex minúsculo)</label><input id="key" maxlength="64" spellcheck="false">
<button id="verify" disabled>Verificar assinatura</button>
<p id="result" role="status" aria-live="polite">A carregar o verificador…</p><pre id="outcome"></pre>
</main><script type="module" src="js/verify.js"></script></html>
