[workspace]
resolver = "2"
members = ["crates/arkhe-pix-receipt", "crates/arkhe-pix-bcb", "crates/arkhe-pix-cli", "crates/arkhe-pix-wasm"]
[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
[workspace.dependencies]
arkhe-pix-receipt = { path = "crates/arkhe-pix-receipt" }
blake3 = "1"
ed25519-dalek = "=2.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "=0.2.0"
thiserror = "2"
base64 = "0.22"
hex = "0.4"
