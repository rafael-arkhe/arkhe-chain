[package]
name = "arkhe-chain"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
arkhe-core = { path = "../arkhe-core" }
arkhe-governance = { path = "../../governance/arkhe-governance" }
arkhe-verify-core = { path = "../../verification/crates/arkhe-verify-core" }
blake3.workspace = true
futures = "0.3"
libp2p = { version = "=0.54.1", default-features = false, features = ["tokio", "tcp", "noise", "yamux", "macros", "request-response", "cbor", "dns"] }
native-tls = "0.2"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tempfile = "3"
fips204 = { version = "=0.4.6", default-features = false, features = ["ml-dsa-65"] }
base64 = "0.22"
hex = "0.4"
sha2.workspace = true
sigstore-crypto = "=0.6.6"
sigstore-trust-root = "=0.6.6"
sigstore-types = "=0.6.6"
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8"] }

[dev-dependencies]
hex.workspace = true
arkhe-kernel = { path = "../arkhe-kernel" }
async-trait.workspace = true
futures = "0.3"
libp2p = { version = "=0.54.1", default-features = false, features = ["tokio", "tcp", "noise", "yamux", "macros", "request-response", "cbor"] }
serde.workspace = true
tokio.workspace = true
