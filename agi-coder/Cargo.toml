[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"

[workspace.dependencies]
agi-coder-core = { path = "crates/agi-coder-core" }
agi-coder-kernel = { path = "crates/agi-coder-kernel" }
agi-coder-journal = { path = "crates/agi-coder-journal" }
agi-coder-wormgraph = { path = "crates/agi-coder-wormgraph" }
agi-coder-cognition = { path = "crates/agi-coder-cognition" }
agi-coder-memory = { path = "crates/agi-coder-memory" }
agi-coder-verification = { path = "crates/agi-coder-verification" }
agi-coder-pipeline = { path = "crates/agi-coder-pipeline" }
agi-coder-research = { path = "crates/agi-coder-research" }
agi-coder-jules = { path = "crates/agi-coder-jules" }
agi-coder-cost = { path = "crates/agi-coder-cost" }
agi-coder-inference = { path = "crates/agi-coder-inference" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
hex = "0.4"
thiserror = "2"
ed25519-dalek = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "io-util", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"

