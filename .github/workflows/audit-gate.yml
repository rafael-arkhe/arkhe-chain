name: Audit gate

on:
  pull_request:
  push:
    branches:
      - main
      - fix/audit-remediation
      - demo/delegated-audit
      - fix/delegated-recovery
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chain:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install matching Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --no-self-update
      - name: Select Rust toolchain
        run: rustup default 1.99.1
      - name: Install demo verifier dependency
        run: python -m pip install -r scripts/requirements-demo.txt
      - name: Build ledger demo and public verifier
        run: cargo build --locked --example delegated_audit_ledger
      - name: Test delegation and adversarial evidence
        shell: bash
        run: python -B -m unittest discover -s tests -p test_delegated_audit.py -v > "$RUNNER_TEMP/delegated-adversarial.log" 2>&1
      - name: Test exact checkout
        shell: bash
        env:
          LEDGER_BINARY: target/debug/examples/delegated_audit_ledger${{ runner.os == 'Windows' && '.exe' || '' }}
        run: python -B scripts/delegated_audit.py run --output "$RUNNER_TEMP/arkhe-delegated" --ledger-binary "$LEDGER_BINARY"
      - name: Reconcile a modeled interruption of the real result
        shell: bash
        env:
          LEDGER_BINARY: target/debug/examples/delegated_audit_ledger${{ runner.os == 'Windows' && '.exe' || '' }}
        run: python -B scripts/exercise_reconciliation.py --source-run "$RUNNER_TEMP/arkhe-delegated" --output "$RUNNER_TEMP/arkhe-reconciliation" --ledger-binary "$LEDGER_BINARY"
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: arkhe-gate-${{ matrix.os }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/arkhe-delegated
            ${{ runner.temp }}/delegated-adversarial.log
            ${{ runner.temp }}/arkhe-reconciliation
          if-no-files-found: error
