# Security gates scoped to `kernel/arkhe-chain`. The copied monorepo workflow
# (AI/RAG/billing/gov-worker) does not apply to this repository layout.
name: security
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read

jobs:
  ai-boundaries:
    name: ai-boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
      - name: Consensus and admission falsifiers
        run: |
          cargo test --locked -p arkhe-chain --test c1_reorg -- --nocapture
          cargo test --locked -p arkhe-chain --test c2_canonical_vote -- --nocapture
          cargo test --locked -p arkhe-chain --test attest -- --nocapture
          cargo test --locked -p arkhe-chain --test limits -- --nocapture
          cargo test --locked -p arkhe-chain --test halt -- --nocapture

  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
      - name: Locked dependency tree (arkhe-chain)
        run: cargo tree -p arkhe-chain --locked --depth 0
      - name: Secret scan (crate sources)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: kernel/arkhe-chain
          scanners: secret
          severity: HIGH,CRITICAL
          exit-code: '1'
          skip-dirs: target,site,vendor,testnet,docs
          format: table

  sast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Physical limit: CodeQL Rust still walks a full monorepo checkout
          # even with paths filters, which blows past the gate budget.
          sparse-checkout: |
            .github/codeql
            scripts/check_sarif.py
            rust-toolchain.toml
            Cargo.toml
            Cargo.lock
            kernel/arkhe-chain
            kernel/arkhe-core
            kernel/arkhe-kernel
            governance/arkhe-governance
            verification/crates/arkhe-verify-core
          sparse-checkout-cone-mode: true
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: github/codeql-action/init@793b778da9c9275a0f276522b27cb5fc14bba279
        with:
          languages: rust
          build-mode: none
          config-file: ./.github/codeql/arkhe-chain.yml
      - uses: github/codeql-action/analyze@793b778da9c9275a0f276522b27cb5fc14bba279
        with:
          upload: false
          output: codeql-results
      - name: Block security findings (arkhe-chain paths only)
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          files = list(Path("codeql-results").rglob("*.sarif"))
          if not files:
              raise SystemExit("FAIL: no SAST results")
          count = 0
          for file in files:
              for run in json.loads(file.read_text()).get("runs", []):
                  for result in run.get("results", []):
                      uri = (
                          result.get("locations", [{}])[0]
                          .get("physicalLocation", {})
                          .get("artifactLocation", {})
                          .get("uri", "")
                          .replace("\\", "/")
                      )
                      if uri.startswith("kernel/arkhe-chain/"):
                          count += 1
          print(f"arkhe-chain SAST findings: {count}")
          raise SystemExit(1 if count else 0)
          PY

  billing-migration:
    if: false # N/A: billing SQL gates belong to the full Arkhe monorepo, not arkhe-chain.
    runs-on: ubuntu-latest
    steps:
      - run: echo "skipped — billing-migration is not applicable to arkhe-chain"

  gov-worker-adversarial:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
      - name: Audit, Rekor, and replay adversarial tests
        run: |
          cargo test --locked -p arkhe-chain --test rekor_fixture -- --nocapture
          cargo test --locked -p arkhe-chain --test audit_bundle -- --nocapture
          cargo test --locked -p arkhe-chain --test audit_regressions -- --nocapture
          cargo test --locked -p arkhe-chain --test replay_log -- --nocapture
          cargo test --locked -p arkhe-chain --test contingency -- --nocapture