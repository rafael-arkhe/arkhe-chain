schema_version: "1.1"
name: secrets-store-readme
expected_outcome: |
  A per-claim verdict for the six README features, a claims registry the bundled
  checker accepts, and a report. AES-256-GCM encryption at rest is backed by code and
  tests. Zero-knowledge is contradicted (server.py decrypts with a server-held key).
  Key rotation, SOC 2 and the p99 latency number have nothing behind them. The audit
  log covers reads and writes but not deletes. The `vaultlite status` CLI prints
  SECURE and rotation OK as constants.
