[workspace]
resolver = "2"
members = [
  "crates/arkhe-flow",
  "crates/arkhe-storage",
  "crates/arkhe-provenance-mcp",
  "crates/arkhe-platform",
  "crates/arkhe-anonymize",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0 OR MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4.5", features = ["derive"] }
ed25519-dalek = "2.2.0"
hex = "0.4"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
