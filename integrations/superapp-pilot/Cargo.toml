[package]
name = "arkhe-superapp-pilot"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"

# Isolated pilot: does not change the production workspace or its lockfile.
[workspace]

[dependencies]
arkhe-verify-core = { path = "../../verification/crates/arkhe-verify-core" }
ed25519-dalek = "=2.2.0"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
wasmi = "=0.40.0"
wat = "=1.240.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

