# Local devnet: four validators on one bridge network. val1 seals; the
# others follow. Create testnet/data/inbox before the first start.
networks:
  arkhe-testnet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

services:
  val1:
    build:
      context: ..
      dockerfile: testnet/docker/Dockerfile
    container_name: arkhe-val1
    restart: unless-stopped
    command:
      - "--id"
      - "val1"
      - "--key"
      - "/etc/arkhe/keys/val1.key"
      - "--genesis"
      - "/etc/arkhe/genesis.txt"
      - "--data"
      - "/var/lib/arkhe/val1.data"
      - "--listen"
      - "/ip4/0.0.0.0/tcp/30333"
      - "--peer-file"
      - "/etc/arkhe/peers.txt"
      # val1 is the only sealing process. --time is the timestamp of block 1;
      # later blocks use the parent timestamp plus one.
      - "--seal"
      - "--time"
      - "1794000000"
      - "--inbox"
      - "/var/lib/arkhe/inbox"
    volumes:
      - ./keys:/etc/arkhe/keys:ro
      - ./genesis.txt:/etc/arkhe/genesis.txt:ro
      - ./peers.docker.txt:/etc/arkhe/peers.txt:ro
      - val1-data:/var/lib/arkhe
      # Transaction lists dropped in testnet/data/inbox are read by val1.
      - ./data/inbox:/var/lib/arkhe/inbox
    networks:
      arkhe-testnet:
        ipv4_address: 172.28.0.11
    ports:
      - "30333:30333"

  val2:
    build:
      context: ..
      dockerfile: testnet/docker/Dockerfile
    container_name: arkhe-val2
    restart: unless-stopped
    command:
      - "--id"
      - "val2"
      - "--key"
      - "/etc/arkhe/keys/val2.key"
      - "--genesis"
      - "/etc/arkhe/genesis.txt"
      - "--data"
      - "/var/lib/arkhe/val2.data"
      - "--listen"
      - "/ip4/0.0.0.0/tcp/30334"
      - "--peer-file"
      - "/etc/arkhe/peers.txt"
    volumes:
      - ./keys:/etc/arkhe/keys:ro
      - ./genesis.txt:/etc/arkhe/genesis.txt:ro
      - ./peers.docker.txt:/etc/arkhe/peers.txt:ro
      - val2-data:/var/lib/arkhe
    networks:
      arkhe-testnet:
        ipv4_address: 172.28.0.12
    ports:
      - "30334:30334"

  val3:
    build:
      context: ..
      dockerfile: testnet/docker/Dockerfile
    container_name: arkhe-val3
    restart: unless-stopped
    command:
      - "--id"
      - "val3"
      - "--key"
      - "/etc/arkhe/keys/val3.key"
      - "--genesis"
      - "/etc/arkhe/genesis.txt"
      - "--data"
      - "/var/lib/arkhe/val3.data"
      - "--listen"
      - "/ip4/0.0.0.0/tcp/30335"
      - "--peer-file"
      - "/etc/arkhe/peers.txt"
    volumes:
      - ./keys:/etc/arkhe/keys:ro
      - ./genesis.txt:/etc/arkhe/genesis.txt:ro
      - ./peers.docker.txt:/etc/arkhe/peers.txt:ro
      - val3-data:/var/lib/arkhe
    networks:
      arkhe-testnet:
        ipv4_address: 172.28.0.13
    ports:
      - "30335:30335"

  val4:
    build:
      context: ..
      dockerfile: testnet/docker/Dockerfile
    container_name: arkhe-val4
    restart: unless-stopped
    command:
      - "--id"
      - "val4"
      - "--key"
      - "/etc/arkhe/keys/val4.key"
      - "--genesis"
      - "/etc/arkhe/genesis.txt"
      - "--data"
      - "/var/lib/arkhe/val4.data"
      - "--listen"
      - "/ip4/0.0.0.0/tcp/30336"
      - "--peer-file"
      - "/etc/arkhe/peers.txt"
    volumes:
      - ./keys:/etc/arkhe/keys:ro
      - ./genesis.txt:/etc/arkhe/genesis.txt:ro
      - ./peers.docker.txt:/etc/arkhe/peers.txt:ro
      - val4-data:/var/lib/arkhe
    networks:
      arkhe-testnet:
        ipv4_address: 172.28.0.14
    ports:
      - "30336:30336"

volumes:
  val1-data:
  val2-data:
  val3-data:
  val4-data:
