[package]
name = "aegis-island"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "A ilha: HTTP, saude, e a API do vertical instalado."

[dependencies]
aegis-vertical = { workspace = true }
aegis-ambiente = { workspace = true }
