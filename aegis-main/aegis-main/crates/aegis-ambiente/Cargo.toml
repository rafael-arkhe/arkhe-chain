[package]
name = "aegis-ambiente"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "O ambiente do produto lido num sitio so. Crate folha: nao depende de nada."

# 🔴 Sem dependências, e é o ponto. Quem lê o ambiente é o `aegis-store` (o
# banco), o `aegis-island` (o interpretador das verificações) e o
# `aegis-produto` (a raiz do vendor) — e nenhum deles pode depender de outro,
# porque já dependem uns dos outros. Um lugar comum que três precisam só pode
# ser uma folha: um crate que não conhece ninguém.
[dependencies]
