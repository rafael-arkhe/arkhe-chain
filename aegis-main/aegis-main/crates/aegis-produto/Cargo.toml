[package]
name = "aegis-produto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "As operacoes do produto, como biblioteca: a casca (CLI) e a janela (GUI) sao as DUAS Faces da MESMA coisa."

[dependencies]
aegis-vertical = { workspace = true }
aegis-ambiente = { workspace = true }
aegis-ontology = { workspace = true }
aegis-store = { workspace = true }
aegis-island = { workspace = true }
aegis-license = { workspace = true }
# 🔴 O vocabulário de recusa junta o que a página recusa ao que a licença
# recusa, e é por isso que este crate conhece a página. Sem esta dependência
# a lista viveria na casca — e aí seria a segunda versão da regra.
aegis-pagina = { workspace = true }
aegis-identity = { workspace = true }
# 🔴 A ponte entra como **dependência** e não como conveniência: o D1 movceu as
# câmaras para a biblioteca, e foi o que impediu a face agêntica de ser a
# segunda tradução da recusa. O `aegis-ponte` é o dono do vocabulário da lista
# de câmaras; a operação é do produto.
aegis-ponte = { workspace = true }
# 🔴 O cliente da ilha. Vive aqui e não na casca porque a **recusa** tem de vir
# com o código, a frase e o gesto que a ilha respondeu — e essa tradução, se
# estivesse no `mcp`, seria uma segunda tradução.
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
sha2 = "0.10"
hex = "0.4"
