[package]
name = "arkhe-ritual"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"

[workspace]

[dependencies]
arkhe-core = { path = "../../kernel/arkhe-core" }
arkhe-kernel = { path = "../../kernel/arkhe-kernel" }
arkhe-governance = { path = "../../governance/arkhe-governance" }
arkhe-wormgraph = { path = "../../evidence/arkhe-wormgraph" }
arkhe-verify-core = { path = "../../verification/crates/arkhe-verify-core" }
async-trait = "0.1"
blake3 = "1.5"
ed25519-dalek = "2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "json", "migrate", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
hex = "0.4"
getrandom = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
ciborium = "0.2"

[[example]]
name = "vector"
