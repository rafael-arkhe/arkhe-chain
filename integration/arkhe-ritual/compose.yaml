services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ritual_test
      POSTGRES_PASSWORD: local_test_only
      POSTGRES_DB: ritual_test
    ports:
      - "127.0.0.1:55439:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ritual_test -d ritual_test"]
      interval: 2s
      timeout: 2s
      retries: 30
