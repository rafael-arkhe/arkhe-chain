[package]
name = "arkhe-kya-experimental"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"

[workspace]
resolver = "2"
members = ["crates/arkhe-kya-primitives", "crates/arkhe-kya-status"]

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "arkhe-kya"
path = "src/bin/arkhe-kya.rs"

[dependencies]
arkhe-kya-primitives = { path = "crates/arkhe-kya-primitives" }
arkhe-kya-status = { path = "crates/arkhe-kya-status" }
arkhe-verify-core = { path = "../../verification/crates/arkhe-verify-core" }
blake3 = "1"
bs58 = "0.5"
ed25519-dalek = "=2.2.0"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "=0.2.0"
wasm-bindgen = "=0.2.126"
base64 = "=0.22.1"
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
