[package]
name = "arkhe-p2p"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
blake3.workspace = true
bao = "=0.13.1"
sha2.workspace = true
hex.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "time", "macros", "rt-multi-thread"] }
tokio-util = { version = "0.7", features = ["io"] }
reqwest = { workspace = true, default-features = false, features = ["rustls-tls", "stream"] }
futures-util = { version = "0.3", features = ["sink"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
nostr = "=0.44.8"
serde_json.workspace = true
url = "2"
# Hashtree CHK (AES-256-GCM, HKDF-SHA256) and nhash (bech32) decoding.
aes-gcm = "=0.10.3"
hkdf = "0.12"
bech32 = "0.11"
