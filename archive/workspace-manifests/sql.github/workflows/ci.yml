name: ci
on:
  push:
  pull_request:
  workflow_call:
jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: arkhe
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d arkhe"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/arkhe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo run -p arkhe-sql-migrate -- migrate
      - run: cargo run -p arkhe-sql-migrate -- rls-audit
      - run: cargo run -p arkhe-sql-migrate -- append-only-audit
      - run: cargo test --workspace --locked
