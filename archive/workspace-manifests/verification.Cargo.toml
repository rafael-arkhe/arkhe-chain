[workspace]
resolver = "2"
members = [
  "crates/arkhe-verify-core",
  "crates/arkhe-verify-cli",
  "crates/arkhe-verify-wasm",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0 OR MIT"

[workspace.dependencies]
anyhow = "1"
blake3 = "1.5"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
wasm-bindgen = "0.2"
